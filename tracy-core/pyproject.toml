[project]
name = "tracy-core"
version = "0.1.0"
description = "Tracy Core - orchestrateur IA de Tracy (agents, tools, mémoire)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "langgraph>=0.2",
    "openai>=1.40",
    "redis>=5.0",
    # Vision modules (Product Vision, Authenticity, Conformity, Shop Quality)
    "torch>=2.2",
    "transformers>=4.40",
    "ultralytics>=8.2",
    "Pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "skip_common_mocks: skip autouse mock_mantota_common_methods fixture (for tests that mock these endpoints themselves)",
]

[tool.setuptools.packages.find]
include = ["app*"]
