name: mantota_app
description: "MANTOTA — Plateforme de e-commerce intelligente propulsée par Tracy IA. Discuter, vendre, payer."
publish_to: 'none'
version: 1.0.0+2007

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Réseau ──
  dio: ^5.7.0

  # ── Routing ──
  go_router: ^14.6.2

  # ── State management ──
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Stockage sécurisé ──
  flutter_secure_storage: ^9.2.3

  # ── Images ──
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # ── WebSocket ──
  web_socket_channel: ^3.0.1

  # ── Utilitaires ──
  intl: ^0.19.0
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

  # ── Localisation (propositions de proximité Tracy) ──
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/mantota_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0BBFA0"
  adaptive_icon_foreground: "assets/icons/mantota_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
